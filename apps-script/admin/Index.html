<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f6f7f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { margin: 0 0 20px; color: #666; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      background: #fff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 1px 4px #0001;
    }
    label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
    input, button, select { font: inherit; }
    input[type="date"], select {
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 9px;
      background: #fff;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      background: #24364b;
      color: #fff;
    }
    button.secondary { background: #e9edf1; color: #24364b; }
    button:disabled { opacity: .6; cursor: wait; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 2px;
    }
    .status { min-height: 24px; color: #666; }
    .period { font-weight: 700; color: #333; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin: 18px 0;
    }
    .card, .panel {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 4px #0001;
    }
    .card { padding: 18px; }
    .card .label { color: #666; font-size: 13px; }
    .card .value { font-size: 28px; font-weight: 750; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { padding: 18px; overflow: hidden; }
    .panel h2 { font-size: 18px; margin: 0 0 14px; }
    .chart {
      display: flex;
      align-items: end;
      gap: 6px;
      height: 220px;
      border-bottom: 1px solid #ddd;
      padding-top: 12px;
      overflow-x: auto;
    }
    .bar-wrap {
      min-width: 34px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: end;
      align-items: center;
      gap: 5px;
    }
    .bar {
      width: 22px;
      min-height: 2px;
      background: #6d7f91;
      border-radius: 5px 5px 0 0;
    }
    .bar-label {
      font-size: 10px;
      color: #777;
      writing-mode: vertical-rl;
      max-height: 64px;
      overflow: hidden;
    }
    .top-list { display: grid; gap: 10px; }
    .top-item {
      display: grid;
      grid-template-columns: 120px 1fr 44px;
      gap: 8px;
      align-items: center;
    }
    .top-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }
    .top-track {
      height: 18px;
      background: #eef1f4;
      border-radius: 999px;
      overflow: hidden;
    }
    .top-fill {
      height: 100%;
      background: #6d7f91;
      border-radius: 999px;
    }
    .top-count { text-align: right; font-variant-numeric: tabular-nums; }
    .table-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid #eee; text-align: left; }
    th:nth-child(3), th:nth-child(4), td:nth-child(3), td:nth-child(4) { text-align: right; }
    .note { margin-top: 16px; color: #777; font-size: 13px; line-height: 1.5; }
    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      main { padding: 22px 14px 40px; }
      h1 { font-size: 24px; }
      .filters { align-items: stretch; }
      .filters label, .filters > button { width: 100%; }
      .quick { width: 100%; }
      .quick button { flex: 1 1 45%; }
      .kpis { grid-template-columns: 1fr; }
      .card .value { font-size: 24px; }
      .top-item { grid-template-columns: 100px 1fr 40px; }
    }
  </style>
</head>
<body>
<main>
  <h1>心靈解籤所 3.0｜統計管理後台</h1>
  <p class="sub">匿名使用統計。匿名瀏覽器數僅供估算，不代表真實人數。</p>

  <section class="filters">
    <label>
      開始日期
      <input id="start" type="date">
    </label>
    <label>
      結束日期
      <input id="end" type="date">
    </label>
    <button id="refresh" type="button">更新統計</button>
    <button id="exportCsv" class="secondary" type="button">匯出 CSV</button>
    <div class="quick">
      <button class="secondary" data-range="today" type="button">今天</button>
      <button class="secondary" data-range="7" type="button">近 7 天</button>
      <button class="secondary" data-range="30" type="button">近 30 天</button>
      <button class="secondary" data-range="month" type="button">本月</button>
    </div>
  </section>

  <div class="status-row">
    <div class="status" id="status"></div>
    <div class="period" id="period"></div>
  </div>

  <section class="kpis">
    <div class="card"><div class="label">總抽籤次數</div><div class="value" id="totalDraws">—</div></div>
    <div class="card"><div class="label">匿名瀏覽器數</div><div class="value" id="uniqueBrowsers">—</div></div>
    <div class="card"><div class="label">平均每瀏覽器抽籤次數</div><div class="value" id="averageDraws">—</div></div>
    <div class="card"><div class="label">重複使用瀏覽器數</div><div class="value" id="repeatBrowsers">—</div></div>
    <div class="card"><div class="label">重複使用比例</div><div class="value" id="repeatRate">—</div></div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>每日抽籤趨勢</h2>
      <div class="chart" id="dailyChart"></div>
    </div>

    <div class="panel">
      <h2>Top 10 卦象</h2>
      <div class="top-list" id="topHexagrams"></div>
    </div>
  </section>

  <section class="panel" style="margin-top:16px">
    <div class="table-head">
      <h2 style="margin:0">64 卦抽中排行</h2>
      <label>
        排序
        <select id="sortMode">
          <option value="count-desc">次數：高到低</option>
          <option value="count-asc">次數：低到高</option>
          <option value="number-asc">卦號：小到大</option>
          <option value="number-desc">卦號：大到小</option>
          <option value="name-asc">卦名</option>
        </select>
      </label>
    </div>
    <div style="max-height:520px;overflow:auto">
      <table>
        <thead>
          <tr><th>卦</th><th>卦名</th><th>次數</th><th>比例</th></tr>
        </thead>
        <tbody id="hexagramRows"></tbody>
      </table>
    </div>
  </section>

  <p class="note">
    匿名瀏覽器 ID 來自同一瀏覽器的 localStorage。換裝置、換瀏覽器、無痕模式或清除網站資料後可能產生新的 ID，因此只能用來估算重複使用情形。
  </p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const toDateInput = d =>
    d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  let currentData = null;

  function setRange(kind) {
    const end = new Date();
    const start = new Date(end);

    if (kind === 'month') {
      start.setDate(1);
    } else if (kind !== 'today') {
      start.setDate(start.getDate() - (Number(kind) - 1));
    }

    $('start').value = toDateInput(start);
    $('end').value = toDateInput(end);
    load();
  }

  function load() {
    $('status').textContent = '讀取統計資料中…';
    $('refresh').disabled = true;

    google.script.run
      .withSuccessHandler(render)
      .withFailureHandler(error => {
        $('status').textContent =
          error && error.message ? error.message : '讀取失敗。';
        $('refresh').disabled = false;
      })
      .getDashboardData($('start').value, $('end').value);
  }

  function render(data) {
    currentData = data;
    $('status').textContent = '統計資料已更新';
    $('period').textContent = data.period.start + ' ～ ' + data.period.end;
    $('refresh').disabled = false;

    $('totalDraws').textContent = data.kpis.totalDraws.toLocaleString('zh-TW');
    $('uniqueBrowsers').textContent = data.kpis.uniqueBrowsers.toLocaleString('zh-TW');
    $('averageDraws').textContent = data.kpis.averageDraws.toFixed(2);
    $('repeatBrowsers').textContent = data.kpis.repeatBrowsers.toLocaleString('zh-TW');
    $('repeatRate').textContent = (data.kpis.repeatRate * 100).toFixed(1) + '%';

    renderDaily(data.daily);
    renderTop10(data.hexagrams);
    renderTable();
  }

  function renderDaily(daily) {
    const max = Math.max(1, ...daily.map(item => item.count));

    $('dailyChart').innerHTML = daily.length
      ? daily.map(item => {
          const height = Math.max(2, Math.round((item.count / max) * 150));
          return (
            '<div class="bar-wrap" title="' + item.date + '：' + item.count + ' 次">' +
              '<strong>' + item.count + '</strong>' +
              '<div class="bar" style="height:' + height + 'px"></div>' +
              '<span class="bar-label">' + item.date.slice(5) + '</span>' +
            '</div>'
          );
        }).join('')
      : '<p>此期間沒有抽籤資料。</p>';
  }

  function renderTop10(hexagrams) {
    const top = [...hexagrams]
      .sort((a, b) => b.count - a.count || Number(a.number) - Number(b.number))
      .slice(0, 10);

    const max = Math.max(1, ...top.map(item => item.count));

    $('topHexagrams').innerHTML = top.length
      ? top.map(item =>
          '<div class="top-item">' +
            '<div class="top-name">第 ' + escapeHtml(item.number) + ' 卦 ' + escapeHtml(item.name) + '</div>' +
            '<div class="top-track">' +
              '<div class="top-fill" style="width:' + ((item.count / max) * 100).toFixed(1) + '%"></div>' +
            '</div>' +
            '<div class="top-count">' + item.count + '</div>' +
          '</div>'
        ).join('')
      : '<p>此期間沒有抽籤資料。</p>';
  }

  function renderTable() {
    if (!currentData) return;

    const mode = $('sortMode').value;
    const rows = [...currentData.hexagrams];

    rows.sort((a, b) => {
      if (mode === 'count-asc') {
        return a.count - b.count || Number(a.number) - Number(b.number);
      }
      if (mode === 'number-asc') {
        return Number(a.number) - Number(b.number);
      }
      if (mode === 'number-desc') {
        return Number(b.number) - Number(a.number);
      }
      if (mode === 'name-asc') {
        return String(a.name).localeCompare(String(b.name), 'zh-Hant');
      }
      return b.count - a.count || Number(a.number) - Number(b.number);
    });

    $('hexagramRows').innerHTML = rows.length
      ? rows.map(item =>
          '<tr>' +
            '<td>' + escapeHtml(item.number) + '</td>' +
            '<td>' + escapeHtml(item.name) + '</td>' +
            '<td>' + item.count + '</td>' +
            '<td>' + (item.rate * 100).toFixed(1) + '%</td>' +
          '</tr>'
        ).join('')
      : '<tr><td colspan="4">此期間沒有資料。</td></tr>';
  }

  function exportCsv() {
    $('exportCsv').disabled = true;
    $('status').textContent = '正在準備 CSV…';

    google.script.run
      .withSuccessHandler(csv => {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

        link.href = url;
        link.download =
          'student-support-' + $('start').value + '-to-' + $('end').value + '.csv';
        link.click();

        URL.revokeObjectURL(url);
        $('exportCsv').disabled = false;
        $('status').textContent = 'CSV 已產生';
      })
      .withFailureHandler(error => {
        $('status').textContent =
          error && error.message ? error.message : 'CSV 匯出失敗。';
        $('exportCsv').disabled = false;
      })
      .getDashboardCsv($('start').value, $('end').value);
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(
      /[&<>"']/g,
      char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]
    );
  }

  $('refresh').addEventListener('click', load);
  $('exportCsv').addEventListener('click', exportCsv);
  $('sortMode').addEventListener('change', renderTable);

  document.querySelectorAll('[data-range]').forEach(button => {
    button.addEventListener('click', () => setRange(button.dataset.range));
  });

  setRange('30');
</script>
</body>
</html>
